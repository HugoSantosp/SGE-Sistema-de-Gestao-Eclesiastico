<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo-icert.png" alt="Icert Logo">
      <h2>Trocar Senha</h2>
      <p>Primeiro acesso — defina sua nova senha</p>
    </div>

    <div *ngIf="sucesso" class="alert alert-success py-3 d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill"></i>
      <span>Senha alterada com sucesso! Redirecionando…</span>
    </div>

    <form *ngIf="!sucesso" (ngSubmit)="trocar()">
      <div class="mb-3">
        <label class="form-label" for="senhaAtual">Senha atual</label>
        <input id="senhaAtual"
               type="password"
               class="form-control"
               placeholder="Digite sua senha atual"
               [(ngModel)]="senhaAtual"
               name="senhaAtual"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="novaSenha">Nova senha</label>
        <input id="novaSenha"
               type="password"
               class="form-control"
               placeholder="Mínimo 6 caracteres"
               [(ngModel)]="novaSenha"
               name="novaSenha"
               required>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirmacao">Confirmar nova senha</label>
        <input id="confirmacao"
               type="password"
               class="form-control"
               placeholder="Repita a nova senha"
               [(ngModel)]="confirmacao"
               name="confirmacao"
               required>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle"></i>
        <span>{{ error }}</span>
      </div>

      <button type="submit"
              class="btn btn-primary w-100 py-3 fw-semibold"
              [disabled]="loading">
        <ng-container *ngIf="!loading"><i class="bi bi-check2-circle me-1"></i> Alterar senha</ng-container>
        <ng-container *ngIf="loading"><div class="loader-dots"><span></span><span></span><span></span></div></ng-container>
      </button>

      <div class="text-center mt-3">
        <a href="javascript:void(0)" class="text-muted small" (click)="sair()">Voltar ao login</a>
      </div>
    </form>
  </div>
</div>
