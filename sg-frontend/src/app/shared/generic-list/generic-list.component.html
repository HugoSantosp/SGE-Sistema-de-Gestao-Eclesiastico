<!-- Componente de Toast para notificações -->
<app-toast></app-toast>

<!-- Modal de Confirmação de Exclusão -->
<app-confirm-dialog
  [visible]="showDeleteConfirm"
  title="Confirmar Exclusão"
  [message]="'Tem certeza que deseja excluir ' + (itemToDelete?.nome || itemToDelete?.titulo || 'este registro') + '? Esta ação não pode ser desfeita.'"
  confirmText="Excluir"
  cancelText="Cancelar"
  type="danger"
  [loading]="deleting"
  (confirm)="deletar()"
  (cancel)="cancelDelete()">
</app-confirm-dialog>

<!-- Diálogo de alteração de status -->
<app-status-dialog
  [visible]="showStatusDialog"
  [title]="statusAction?.label || 'Alterar status'"
  [registro]="statusItem?.descricao || ''"
  [currentStatus]="statusItem?.[statusAction?.field || 'status'] || ''"
  [options]="statusAction?.options || []"
  [loading]="savingStatus"
  (confirm)="confirmarStatus($event)"
  (cancel)="cancelarStatus()">
</app-status-dialog>

<div class="table-container">
  <div class="table-header">
    <h5 class="mb-0 fw-semibold"><i class="bi {{ icon }} me-2"></i>{{ title }}</h5>
    <button class="btn btn-primary btn-sm" *ngIf="canCreate" (click)="novo()">
      <i class="bi bi-plus-lg"></i> Novo
    </button>
  </div>

  <!-- Componente de Busca e Filtros -->
  <div class="px-4 pt-4">
    <app-search-filter
      [filters]="filters"
      [searchPlaceholder]="'Buscar ' + title.toLowerCase() + '...'"
      (searchChange)="onSearchChange($event)"
      (filterChange)="onFilterChange($event)"
      (onClearFilters)="onClearFilters()"></app-search-filter>
  </div>

  <!-- Loading Spinner -->
  <app-loading-spinner [loading]="loading" [text]="'Carregando registros...'"></app-loading-spinner>

  <!-- Estado vazio -->
  <div *ngIf="!loading && filtered.length === 0" class="empty-state">
    <i class="bi {{ icon }}"></i>
    <p>Nenhum registro encontrado</p>
    <button class="btn btn-primary" *ngIf="canCreate" (click)="novo()">Adicionar</button>
  </div>

  <!-- Tabela -->
  <div *ngIf="!loading && filtered.length > 0" class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ columnLabel(col) }}</th>
          <th style="width: 300px;">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedItems">
          <td *ngFor="let col of columns" class="fw-medium">{{ formatValue(item, col) }}</td>
          <td class="acoes">
            <!-- Ação principal com texto: Pagar conta / Receber conta -->
            <button *ngIf="podeAcaoRapida(item)"
                    class="btn btn-sm btn-acao-principal"
                    (click)="executarAcaoRapida(item)"
                    [title]="statusAction?.quick?.label">
              <i class="bi" [ngClass]="statusAction?.quick?.icon"></i>
              {{ statusAction?.quick?.label }}
            </button>
            <!-- Alterar status (contas a pagar/receber) -->
            <button *ngIf="statusAction" class="btn btn-sm btn-acao-status" (click)="abrirStatus(item)"
                    [title]="statusAction.label">
              <i class="bi bi-arrow-repeat"></i>
              Status
            </button>
            <!-- Ações extras (ex: ativar/desativar categoria) -->
            <ng-container *ngFor="let acao of extraActions">
              <button *ngIf="acaoVisivel(acao, item)" class="btn btn-sm btn-icon" (click)="executarAcaoExtra(acao, item)"
                      [title]="acao.label" [ngStyle]="{'color': acao.class}">
                <i [class]="acao.icon"></i>
              </button>
            </ng-container>
            <!-- Ações padrão -->
            <button *ngIf="canEdit" class="btn btn-sm btn-icon" (click)="editar(item.id)" title="Editar">
              <i class="bi bi-pencil text-info"></i>
            </button>
            <button *ngIf="canDelete" class="btn btn-sm btn-icon" (click)="confirmDelete(item)" title="Excluir">
              <i class="bi bi-trash text-danger"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <div class="px-4 pb-4" *ngIf="!loading && filtered.length > 0">
    <app-pagination
      [totalItems]="filtered.length"
      [itemsPerPage]="itemsPerPage"
      [currentPage]="currentPage"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</div>
