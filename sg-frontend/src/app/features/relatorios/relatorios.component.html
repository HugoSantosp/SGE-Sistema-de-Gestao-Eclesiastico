<div class="table-container">
  <div class="table-header">
    <h5 class="mb-0 fw-semibold"><i class="bi bi-file-earmark-bar-graph me-2"></i>Relatórios</h5>
  </div>

  <div class="px-4 pt-4">
    <p class="text-muted mb-0" style="font-size: 0.875rem;">
      Escolha o formato e o arquivo será baixado na hora, com os dados atuais do sistema.
    </p>
  </div>

  <div *ngIf="erro" class="px-4 pt-3">
    <div class="alert alert-danger mb-0" role="alert">{{ erro }}</div>
  </div>

  <div class="p-4">
    <div class="row g-3">
      <div class="col-md-6" *ngFor="let r of relatorios">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="fw-semibold mb-0">{{ r.titulo }}</h6>
              <span class="badge" [ngClass]="r.formato === 'PDF' ? 'badge-danger' : 'badge-success'">
                {{ r.formato }}
              </span>
            </div>
            <p class="text-muted mb-3" style="font-size: 0.875rem;">{{ r.descricao }}</p>
            <button class="btn btn-primary btn-sm mt-auto align-self-start"
                    [disabled]="baixando === r.id"
                    (click)="baixar(r)">
              <i class="bi bi-download me-1"></i>
              {{ baixando === r.id ? 'Gerando...' : 'Baixar ' + r.formato }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
