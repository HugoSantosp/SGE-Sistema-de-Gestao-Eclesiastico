<div *ngIf="loading" class="d-flex justify-content-center py-5"><div class="spinner"></div></div>

<div *ngIf="!loading" class="card">
  <h5 class="fw-semibold mb-4">{{ isEdit ? 'Editar' : 'Novo' }} Bispo</h5>
  <form (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nome *</label><input type="text" class="form-control" [(ngModel)]="form.nome" name="nome" required></div>
      <div class="col-md-6"><label class="form-label">Email *</label><input type="email" class="form-control" [(ngModel)]="form.email" name="email" required></div>
      <div class="col-md-4"><label class="form-label">Documento</label><input type="text" class="form-control" [(ngModel)]="form.documento" name="documento"></div>
      <div class="col-md-4"><label class="form-label">Telefone</label><input type="text" class="form-control" [(ngModel)]="form.telefone" name="telefone"></div>
      <div class="col-md-4"><label class="form-label">Endereço</label><input type="text" class="form-control" [(ngModel)]="form.endereco" name="endereco"></div>
      <div class="col-12">
        <label class="form-label">Foto</label>
        <div class="d-flex align-items-center gap-3">
          <div style="position:relative;width:100px;height:100px;">
            <div *ngIf="!form.foto" class="d-flex align-items-center justify-content-center"
                 style="width:100px;height:100px;border-radius:12px;border:2px dashed #ddd;background:#f8f9fa;cursor:pointer;"
                 (click)="fileInput.click()">
              <i class="bi bi-camera fs-2" style="color:#aaa;"></i>
            </div>
            <img *ngIf="form.foto" [src]="form.foto | uploadUrl"
                 style="width:100px;height:100px;border-radius:12px;object-fit:cover;border:2px solid #ddd;cursor:pointer;"
                 (click)="fileInput.click()">
            <button *ngIf="form.foto" type="button" class="btn btn-sm position-absolute"
                    style="top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#dc3545;color:#fff;border:none;font-size:0.7rem;display:flex;align-items:center;justify-content:center;"
                    (click)="form.foto=''; $event.stopPropagation()">
              <i class="bi bi-x"></i>
            </button>
            <input #fileInput type="file" accept="image/*" style="display:none" (change)="onFotoSelected($event)">
          </div>
          <div class="small" style="color:#666;">
            Foto do bispo
            <div *ngIf="uploadingFoto"><div class="spinner-border spinner-border-sm" role="status"></div> Enviando…</div>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="error" class="alert alert-danger mt-3 py-2 small">{{ error }}</div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="saving"><span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>{{ isEdit ? 'Atualizar' : 'Salvar' }}</button>
      <button type="button" class="btn btn-secondary" routerLink="/bispos">Cancelar</button>
    </div>
  </form>
</div>
