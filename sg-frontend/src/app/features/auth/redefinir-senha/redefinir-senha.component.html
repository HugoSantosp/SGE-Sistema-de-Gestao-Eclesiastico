<div class="redefinir-page">
  <div class="redefinir-card">
    <div class="text-center mb-4">
      <img src="assets/logo-icert.png" alt="Icert Logo" height="60">
      <h4 class="mt-3">Redefinir Senha</h4>
    </div>

    <!-- Token inválido -->
    <div *ngIf="tokenInvalido" class="text-center py-3">
      <div class="invalid-icon mb-3">
        <i class="bi bi-exclamation-triangle fs-1"></i>
      </div>
      <p class="text-muted">{{ error }}</p>
      <button class="btn btn-primary mt-2" (click)="irParaLogin()">
        <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
      </button>
    </div>

    <!-- Success -->
    <div *ngIf="success" class="text-center py-4">
      <div class="check-icon mb-3">&#10003;</div>
      <h5 class="text-success">Senha redefinida!</h5>
      <p class="text-muted small">Sua senha foi alterada com sucesso.</p>
      <button class="btn btn-primary mt-2" (click)="irParaLogin()">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ir para o Login
      </button>
    </div>

    <!-- Form -->
    <form *ngIf="!tokenInvalido && !success" (ngSubmit)="redefinir()">
      <p class="text-muted small mb-4 text-center">Digite sua nova senha.</p>

      <div class="mb-3">
        <label class="form-label">Nova Senha</label>
        <div class="input-group">
          <input [type]="showSenha ? 'text' : 'password'"
                 class="form-control" placeholder="Mínimo 3 caracteres"
                 [(ngModel)]="novaSenha" name="novaSenha" required>
          <button class="btn btn-outline-secondary" type="button"
                  (click)="showSenha = !showSenha">
            <i [class]="showSenha ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar Senha</label>
        <div class="input-group">
          <input [type]="showConfirmar ? 'text' : 'password'"
                 class="form-control" placeholder="Confirme a nova senha"
                 [(ngModel)]="confirmarSenha" name="confirmarSenha" required
                 [class.is-invalid]="confirmarSenha && novaSenha !== confirmarSenha">
          <button class="btn btn-outline-secondary" type="button"
                  (click)="showConfirmar = !showConfirmar">
            <i [class]="showConfirmar ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
        <div *ngIf="confirmarSenha && novaSenha !== confirmarSenha" class="invalid-feedback d-block">
          As senhas não conferem
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2"
              [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!loading" class="bi bi-check-lg me-1"></i>
        {{ loading ? 'Redefinindo…' : 'Redefinir Senha' }}
      </button>
    </form>
  </div>
</div>
