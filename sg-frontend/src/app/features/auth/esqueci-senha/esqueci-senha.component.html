<div class="modal-overlay" (click)="fechar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Recuperar Senha</h5>
      <button type="button" class="btn-close btn-close-white" (click)="fechar()"></button>
    </div>

    <div class="modal-body text-center">
      <!-- Success -->
      <div *ngIf="sent" class="py-4">
        <div class="sent-icon mb-3">&#9993;</div>
        <h5>Email enviado!</h5>
        <p class="text-muted small px-3">
          Se existir uma conta com este email, você receberá um link para redefinir sua senha em até 30 minutos.
        </p>
        <p class="text-muted small">Verifique também sua caixa de spam.</p>
        <button class="btn btn-primary mt-3" (click)="voltarAoLogin()">
          <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
        </button>
      </div>

      <!-- Form -->
      <form *ngIf="!sent" (ngSubmit)="enviar()" class="py-2">
        <div class="mb-4">
          <div class="lock-icon mx-auto mb-3">
            <i class="bi bi-key fs-2"></i>
          </div>
          <p class="text-muted small mb-3">
            Informe seu email cadastrado e enviaremos um link para redefinir sua senha.
          </p>
          <input type="email" class="form-control text-center" placeholder="Seu email"
                 [(ngModel)]="email" name="email" required autocomplete="email">
        </div>

        <div *ngIf="error" class="alert alert-danger py-2 small mb-3">
          <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2"
                [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="bi bi-send me-1"></i>
          {{ loading ? 'Enviando…' : 'Enviar Link' }}
        </button>

        <button type="button" class="btn btn-link w-100 mt-2 text-decoration-none"
                (click)="voltarAoLogin()">
          <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
        </button>
      </form>
    </div>
  </div>
</div>
