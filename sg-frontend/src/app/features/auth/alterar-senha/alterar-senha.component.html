<div class="modal-overlay" (click)="fechar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="mb-0"><i class="bi bi-key me-2"></i>Alterar Senha</h5>
      <button type="button" class="btn-close btn-close-white" (click)="fechar()"></button>
    </div>

    <div class="modal-body">
      <!-- Success Message -->
      <div *ngIf="success" class="success-animation">
        <div class="text-center py-4">
          <div class="check-icon mb-3">&#10003;</div>
          <h5 class="text-success">Senha alterada com sucesso!</h5>
          <p class="text-muted small">Sua senha foi atualizada.</p>
        </div>
      </div>

      <!-- Form -->
      <form *ngIf="!success" (ngSubmit)="alterar()">
        <!-- Senha Atual -->
        <div class="mb-3">
          <label class="form-label">Senha Atual</label>
          <div class="input-group">
            <input [type]="showSenhaAtual ? 'text' : 'password'"
                   class="form-control" placeholder="Digite sua senha atual"
                   [(ngModel)]="senhaAtual" name="senhaAtual" required>
            <button class="btn btn-outline-secondary" type="button"
                    (click)="showSenhaAtual = !showSenhaAtual">
              <i [class]="showSenhaAtual ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Nova Senha -->
        <div class="mb-3">
          <label class="form-label">Nova Senha</label>
          <div class="input-group">
            <input [type]="showNovaSenha ? 'text' : 'password'"
                   class="form-control" placeholder="Nova senha (mín. 3 caracteres)"
                   [(ngModel)]="novaSenha" name="novaSenha" required>
            <button class="btn btn-outline-secondary" type="button"
                    (click)="showNovaSenha = !showNovaSenha">
              <i [class]="showNovaSenha ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Confirmar Nova Senha -->
        <div class="mb-3">
          <label class="form-label">Confirmar Nova Senha</label>
          <div class="input-group">
            <input [type]="showConfirmar ? 'text' : 'password'"
                   class="form-control" placeholder="Confirme a nova senha"
                   [(ngModel)]="confirmarSenha" name="confirmarSenha" required
                   [class.is-invalid]="confirmarSenha && novaSenha !== confirmarSenha">
            <button class="btn btn-outline-secondary" type="button"
                    (click)="showConfirmar = !showConfirmar">
              <i [class]="showConfirmar ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="confirmarSenha && novaSenha !== confirmarSenha" class="invalid-feedback d-block">
            As senhas não conferem
          </div>
        </div>

        <!-- Error -->
        <div *ngIf="error" class="alert alert-danger py-2 small">
          <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100 py-2"
                [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="bi bi-check-lg me-1"></i>
          {{ loading ? 'Alterando…' : 'Alterar Senha' }}
        </button>
      </form>
    </div>
  </div>
</div>
