# Configuração de Produção - SGE Backend
# Este arquivo é carregado quando spring.profiles.active=prod

server:
  # Render injeta a env PORT automaticamente; usamos ela primeiro (fallback: SERVER_PORT, depois 8080)
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: sge-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate nativo cria/atualiza o schema automaticamente (sem migrações manuais)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-size: ${MAX_FILE_SIZE:5242880}  # 5MB
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf
  name: ${APP_NAME:SGE - Sistema de Gerenciamento Eclesiástico}
  base-url: ${APP_BASE_URL:https://icertag.com.br}
  # Senha inicial do admin (bootstrap no 1º boot). Vazia em prod = admin não é criado.
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}  # Obrigatório em produção
  expiration: ${JWT_EXPIRATION:86400000}  # 24 horas

# Configuração do Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
    info:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Configuração de logs
logging:
  level:
    root: WARN
    com.sg: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: \"%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n\"
  file:
    name: ${LOG_DIR:logs}/sge-backend.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_SIZE:10MB}
      max-history: ${LOG_RETENTION:30}
      total-size-cap: ${LOG_TOTAL_SIZE:1GB}
      clean-history-on-start: true

# Sentry (monitoramento de erros)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${SENTRY_RELEASE:1.0.0}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  enable-tracing: true

# CORS
app.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:https://icertag.com.br}
app.cors.allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers: "*"
app.cors.allow-credentials: true
app.cors.max-age: 3600
