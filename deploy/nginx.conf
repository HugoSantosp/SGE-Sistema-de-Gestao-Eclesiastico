# ============================================================
# SGE - Nginx (produção / Docker)
#
# Serve os três front-ends no mesmo domínio/porta:
#   /                     -> Site público (Angular)
#   /SGE-Administracao/   -> Painel Administrativo (Angular)
#   /SGE-MeuMinisterio/   -> App Meu Ministério (Angular)
#   /api/*  e  /auth/*    -> Backend (Spring Boot, container "backend")
#
# Este arquivo é copiado para dentro da imagem do frontend
# (ver sg-frontend/Dockerfile) e também pode ser montado via
# volume no docker-compose para ajustes sem rebuild.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- App ADMIN: /SGE-Administracao ----
    location /SGE-Administracao/ {
        alias /usr/share/nginx/html/SGE-Administracao/;
        try_files $uri $uri/ /SGE-Administracao/index.html;
    }

    # ---- App MEU MINISTÉRIO: /SGE-MeuMinisterio ----
    location /SGE-MeuMinisterio/ {
        alias /usr/share/nginx/html/SGE-MeuMinisterio/;
        try_files $uri $uri/ /SGE-MeuMinisterio/index.html;
    }

    # ---- Backend (API) ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Swagger (opcional, exposto publicamente) ----
    location /swagger-ui.html {
        proxy_pass http://backend:8080;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend:8080;
    }

    # Cache de assets com hash (não revalidar)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Site público (fallback SPA na raiz) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
