# ============================================================
# SGE - Nginx (produção)
#
# Serve os dois sistemas no mesmo domínio:
#   icertag.com.br/SGE-Administracao  → app admin (Angular)
#   icertag.com.br/SGE-MeuMinisterio → app MeuMinisterio (Angular)
#   icertag.com.br/api/*  e  /auth/*  → Spring Boot (backend)
#   icertag.com.br/uploads/*          → fotos enviadas
#
# Ajuste os caminhos do root conforme onde o deploy ficar.
# Ex.: root /var/www/sge;  dist/ em /var/www/sge/dist/
# ============================================================

server {
    listen 80;
    server_name icertag.com.br www.icertag.com.br;

    # Redireciona HTTP → HTTPS (se tiver certificado)
    # return 301 https://$host$request_uri;

    # ---- Arquivos estáticos dos dois apps ----
    root /var/www/sge/dist;
    index index.html;

    # ---- App ADMIN: /SGE-Administracao ----
    location /SGE-Administracao/ {
        alias /var/www/sge/dist/sg-frontend/;
        try_files $uri $uri/ /SGE-Administracao/index.html;
    }

    # ---- App MEU MINISTÉRIO: /SGE-MeuMinisterio ----
    location /SGE-MeuMinisterio/ {
        alias /var/www/sge/dist/meu-ministerio/;
        try_files $uri $uri/ /SGE-MeuMinisterio/index.html;
    }

    # ---- Backend (API + uploads) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Fotos enviadas (uploads) ----
    location /uploads/ {
        # Se o backend serve estático em file:./uploads/ (Spring), use proxy:
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # ...ou, se preferir servir direto do disco:
        # alias /var/www/sge/uploads/;
    }

    # ---- Swagger (opcional, exposto publicamente) ----
    location /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
    }
    location /v3/api-docs/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Cache de assets com hash (não revalidar)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
