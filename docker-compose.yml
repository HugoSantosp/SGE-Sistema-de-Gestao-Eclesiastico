services:
  # ============================================
  # PostgreSQL
  # ============================================
  postgres:
    image: postgres:15.7-alpine
    container_name: sge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend (Spring Boot)
  # ============================================
  backend:
    build:
      context: ./sg-backend
      dockerfile: Dockerfile
    container_name: sge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sge}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório}
      APP_BASE_URL: ${APP_BASE_URL:-https://icertag.com.br}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-12345678}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://icertag.com.br}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  # ============================================
  # Frontend (nginx) - Site + Admin + Meu Ministério
  # imagem própria construída a partir de sg-frontend/Dockerfile,
  # que compila os 3 apps Angular e os serve com um único nginx
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: sg-frontend/Dockerfile
    container_name: sge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
